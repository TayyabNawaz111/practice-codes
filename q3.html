<html>
  <head>
    <title>Registration Form</title>
  </head>
  <style>
    input::placeholder {
      color: rgb(7, 7, 207);
      font-weight: bold;
    }
  </style>
  <body>
    <center>
      <form action="#">
        <table border="1" cellspacing="10">
          <thead>
            <tr>
              <td colspan="4">
                <center><h2 style="color: blue">Registration Form</h2></center>
              </td>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="2">
                <center>Complete the form below and press submit!</center>
                <br />
              </td>
            </tr>
            <tr>
              <td rowspan="2">
                <input
                  type="text"
                  placeholder="Full Name*"
                  style="height: 30px"
                />
              </td>
              <td>What is your gender?</td>
            </tr>
            <tr></tr>
            <tr>
              <td rowspan="3">
                <input
                  type="text"
                  placeholder="Father Name*"
                  style="height: 30px"
                />
              </td>
              <td><input type="radio" name="abc" />Male</td>
            </tr>
            <tr>
              <td><input type="radio" name="abc" />Female</td>
            </tr>
          </tbody>
        </table>
      </form>
    </center>
  </body>
</html>
